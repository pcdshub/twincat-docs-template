[workspace]
authors = ["Zachary Lentz <zlentz@slac.stanford.edu>"]
channels = ["conda-forge"]
name = "twincat-docs-template"
platforms = ["linux-64"]
version = "0.1.0"
exclude-newer = "7d"

[tasks]

[dependencies]
python = "3.11.*"
pytmc = ">=2.22.1,<3"
sphinx = "8.*"
sphinx_rtd_theme = ">=3.1.0,<4"

[pypi-dependencies]
ads-deploy = { git = "https://github.com/pcdshub/ads-deploy", tag = "v2.12.0" }
